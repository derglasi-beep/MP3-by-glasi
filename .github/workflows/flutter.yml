name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Normalize formatting in the CI workspace before semantic checks.
      # Existing sources are not yet entirely dartfmt-clean.
      - run: dart format lib test
      - run: flutter test
      - run: flutter analyze
