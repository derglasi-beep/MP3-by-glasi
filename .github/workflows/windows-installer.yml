name: Windows Test Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "installer/windows/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Generate Windows runner when missing
        shell: pwsh
        run: |
          if (-not (Test-Path "windows")) {
            flutter create --platforms=windows .
          }

      - name: Resolve packages
        shell: pwsh
        run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)' | Select-Object -First 1
          if ($line -and $line.Matches.Count -gt 0) {
            $version = $line.Matches[0].Groups[1].Value
          } else {
            $version = "0.0.0"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\MP3-by-Glasi-Portable-${{ steps.version.outputs.version }}.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build EXE installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" "installer\windows\mp3_by_glasi.iss"

      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: MP3-by-Glasi-Windows-${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
